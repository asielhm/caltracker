<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151a18" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="NutriAR. Your daily nutrition, in focus."
    />
    <title>NutriAR · Nutrition, at your pace</title>
    <link rel="icon" href="/assets/brand/mark.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("nutriar-neon-theme") === "light"
            ? "light"
            : "dark";
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="brand.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div class="ambient" aria-hidden="true"></div>
    <main>
      <header class="topbar">
        <a class="brand" href="#" aria-label="NutriAR diary"
          ><img
            class="brand-mark"
            src="/assets/brand/mark.svg"
            width="44"
            height="44"
            alt=""
          /><span
            >nutri<span class="brand-end">ar</span
            ><small>DAILY NUTRITION, IN FOCUS.</small></span
          ></a
        >
        <div class="header-actions">
          <a class="about-link" href="/welcome.html">About NutriAR</a
          ><label class="language-control"
            ><span class="sr-only">Languages</span
            ><select id="language-select" aria-label="Languages">
              <option value="es">ES</option>
              <option value="en">EN</option>
            </select></label
          >
          <button
            class="icon"
            id="theme-toggle"
            aria-label="Switch to light mode"
            aria-pressed="true"
          ></button
          ><button
            class="icon"
            id="export"
            aria-label="Export your data"
            title="Export data"
          >
            <span data-icon="download"></span>
          </button>
        </div>
      </header>
      <div
        id="save-status"
        class="save-status"
        role="status"
        aria-live="polite"
      >
        <span id="save-message"
          >Saved on this device · checking cloud saving…</span
        >
        <a id="sync-signin" href="/api/auth" hidden>Sign in to sync</a>
        <button id="sync-conflict" class="textbtn" hidden>Review copies</button>
        <button id="sync-now" class="textbtn">Sync now</button
        ><button id="check-storage" class="textbtn">Check cloud</button>
      </div>
      <div id="app" tabindex="-1"></div>
      <footer>
        <span>BUILT AROUND YOUR EVERYDAY.</span
        ><span>Nutrition with an Argentine accent. <b>AR ↗</b></span>
      </footer>
    </main>
    <nav class="action-dock" aria-label="Main navigation">
      <button data-view="diary" class="active">
        <span data-icon="diary"></span><span>My diary</span></button
      ><button data-view="foods">
        <span data-icon="foods"></span><span>Food library</span></button
      ><button id="dock-log" class="dock-add" aria-label="Log food">
        <span data-icon="plus"></span></button
      ><button data-view="progress">
        <span data-icon="progress"></span><span>Progress</span></button
      ><button data-view="goals">
        <span data-icon="goals"></span><span>My goals</span>
      </button>
    </nav>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modalbody"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="celebration" aria-hidden="true"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
